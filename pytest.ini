[pytest]
testpaths = a_share_semantic_engine/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore::RuntimeWarning

[tool:pytest]
addopts = -v --tb=short -p no:warnings
