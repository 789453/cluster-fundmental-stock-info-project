project:
  name: a_share_semantic_engine
  random_state: 42
paths:
  records_csv: examples/data/demo_records_all_20.csv
  npy_root: r"D:\Trading\stock_semantic_pipeline_project\artifacts\a_share_semantic_dataset\npy"
  output_root: outputs
views:
  text_views:
  - profile_text
  - product_text
  - model_text
  - chain_text
  - theme_text
  - full_text
  json_views:
  - business_model_json
  - industry_chain_position_json
  - business_logic_json
  - structural_themes_json
  - business_scope_keywords_json
  - core_products_services_json
  - application_scenarios_json
  - end_markets_json
  - customer_types_json
  - uncertainties_json
  anchor_fields:
  - biz_form
  - customer_side
  - chain_level
embedding:
  mode: auto
  tfidf_max_features: 1024
  ngram_range:
  - 1
  - 2
  compact_dim: 64
  dtype: float32
fusion:
  text_weight: 0.55
  json_weight: 0.3
  anchor_weight: 0.1
  quality_weight: 0.05
graph:
  k: 5
  min_sim: 0.05
  mutual: true
  weights:
    semantic_graph: 0.45
    product_graph: 0.2
    model_chain_graph: 0.2
    theme_graph: 0.15
  smooth_alpha: 0.7
  smooth_steps: 1
cluster:
  method: minibatch_kmeans
  n_clusters: 6
  batch_size: 32
  max_iter: 200
export:
  write_parquet: true
  write_csv: true
  write_figures: true
